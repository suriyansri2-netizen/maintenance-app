<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance App</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#f4f6fb}
.container{max-width:1000px;margin:auto;padding:12px}

.header{position:sticky;top:0;z-index:99;background:#ffffffcc;backdrop-filter:blur(10px);padding:10px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}

.tab-bar{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;padding:8px;border:none;border-radius:8px;background:#eef1f7;cursor:pointer}
.tab.active{background:#4f46e5;color:#fff}

.card{background:#fff;border-radius:12px;padding:12px;margin-top:10px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{display:flex;flex-direction:column}
.fg.full{grid-column:1/-1}

input,textarea{padding:7px;border-radius:6px;border:1px solid #ddd}
textarea{min-height:50px}

.dd{position:absolute;background:#fff;border:1px solid #ccc;width:100%;max-height:120px;overflow:auto;display:none;z-index:10}
.dd div{padding:6px;cursor:pointer}

.parts-box{display:none;border:1px dashed #ccc;padding:8px;margin-top:5px}
.part-row{display:grid;grid-template-columns:1fr 1fr 60px 30px;gap:5px;margin-top:5px}

table{width:100%;border-collapse:collapse;font-size:11px}
td,th{border-bottom:1px solid #eee;padding:5px}

.btn{margin-top:10px;width:100%;padding:10px;background:#4f46e5;color:#fff;border:none;border-radius:8px}
.small-btn{font-size:10px}
.del{background:red;color:#fff}

.sec{display:none}
.sec.active{display:block}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div id="form" class="sec active">

<div class="form-grid">

<div class="fg full">
<label>Machine</label>
<div style="position:relative">
<input id="machineInput" oninput="searchMachine(this.value)">
<div id="dropdown" class="dd"></div>
</div>
</div>

<div class="fg"><input id="machineCode" placeholder="Code"></div>
<div class="fg"><input id="machineName" placeholder="Name"></div>

<div class="fg"><input id="date" type="date"></div>
<div class="fg"><input id="tstop" type="time"></div>
<div class="fg"><input id="tstart"></div>
<div class="fg"><input id="tfin"></div>

<div class="fg full"><textarea id="sym"></textarea></div>

<div class="fg"><input id="req" placeholder="Req"></div>
<div class="fg"><input id="acc" placeholder="Acc"></div>

<div class="fg full"><textarea id="cause"></textarea></div>
<div class="fg full"><textarea id="act"></textarea></div>

<div class="fg"><input id="deliver"></div>
<div class="fg"><input id="owner"></div>

</div>

<button class="btn" onclick="save()">SAVE</button>
</div>

<!-- HISTORY -->
<div id="history" class="sec">
<table>
<tbody id="tb"></tbody>
</table>
</div>

</div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzAFx3ZDmlHYtGfEkbbR-RGdCOYkgpV1s_uD77LYZ9_qddlKkJAU0Mz-zKuX5yS04nYsA/exec";

/* MACHINE */
const MACHINES = [
{"code":"03-01-01","name":"STATION__NGD__GAS"},
{"code":"03-02-01","name":"PUMP_1500_GPM"}
];

let data=[];

/* SEARCH */
function searchMachine(val){
const dd=document.getElementById("dropdown");
if(val.length<1){dd.style.display="none";return;}

const res=MACHINES.filter(m=>m.name.toLowerCase().includes(val.toLowerCase())||m.code.includes(val));

dd.innerHTML=res.map(m=>
`<div onclick="selectMachine('${m.name}','${m.code}')">${m.name}</div>`
).join('');

dd.style.display="block";
}

function selectMachine(n,c){
machineInput.value=n;
machineCode.value=c;
machineName.value=n;
dropdown.style.display="none";
}

/* SAVE */
function save(){

const payload={
code:machineCode.value,
name:machineName.value,
date:date.value,
sym:sym.value,
tstop:tstop.value,
tstart:tstart.value,
tfin:tfin.value,
req:req.value,
acc:acc.value,
cause:cause.value,
act:act.value,
deliver:deliver.value,
owner:owner.value
};

fetch(API_URL,{
method:"POST",
body:JSON.stringify(payload)
})
.then(()=>alert("Saved"))
.then(loadData);

}

/* LOAD */
function loadData(){
fetch(API_URL)
.then(r=>r.json())
.then(json=>{
data=json.slice(1).map(r=>({
code:r[1],name:r[2],date:r[3],sym:r[4],
tstop:r[5],tstart:r[6],tfin:r[7],
req:r[8],acc:r[9],cause:r[10],act:r[11],
deliver:r[12],owner:r[13]
}));
render();
});
}

/* RENDER */
function render(){
document.getElementById("tb").innerHTML =
data.map((d,i)=>
`<tr>
<td>${d.code}</td>
<td>${d.name}</td>
<td>${d.date}</td>
<td>${d.sym}</td>
<td>${d.tstop}</td>
<td>${d.tstart}</td>
<td>${d.req}</td>
<td>${d.acc}</td>
<td>${d.cause}</td>
<td>${d.act}</td>
<td>${d.tfin}</td>
<td>${d.deliver}</td>
<td>${d.owner}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`
).join('');
}

/* DELETE */
function del(i){
data.splice(i,1);
render();
}

loadData();

</script>

</body>
</html>
