<head>

<title>Maintenance UT TIK App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#f4f6fb}
.container{max-width:1000px;margin:auto;padding:12px}
.header{position:sticky;top:0;z-index:99;background:#ffffffcc;backdrop-filter:blur(10px);padding:10px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}

label{font-size:11px;margin-bottom:2px;color:#555}

.dd{position:absolute;background:#fff;border:1px solid #ddd;width:100%;max-height:300px;overflow-y:auto;display:none;z-index:999;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.dd div{padding:6px;font-size:12px;cursor:pointer}
.dd div:hover{background:#eee}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:5px;border-bottom:1px solid #eee;text-align:left}
.btn{margin-top:10px;padding:10px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;width:100%;font-size:13px}
.small-btn{padding:4px 6px;font-size:10px;border:none;border-radius:6px;cursor:pointer}
.del{background:#ef4444;color:#fff}
.export{background:#10b981;color:#fff;margin-bottom:8px}
.sec{display:none}
.sec.active{display:block}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:12px;min-width:1200px}
thead th{position:sticky;top:0;z-index:10;background:#4f46e5;color:#fff;padding:10px;text-align:left;white-space:nowrap}

.small-btn.del{background:#ef4444;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer}
.history-toolbar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.history-toolbar input,.history-toolbar select{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;font-size:12px}

];

let data = [];

// ── PROGRESS ──
function setProgress(pct, label) {
  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = label;
}
function hideProgress() {
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("progressBar").style.width = "0%";
}

// ── TAB ──
function switchTab(t, el) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(t).classList.add('active');
  if (t === 'history') render();
}

// ── MACHINE SEARCH ──
function searchMachine(val) {
  const dd = document.getElementById("dropdown");
  if (val.length < 1) { dd.style.display = "none"; return; }
  const q = val.toLowerCase();
  const res = MACHINES.filter(m => m.name.toLowerCase().includes(q) || m.code.includes(q));
  dd.innerHTML = res.map(m =>
    `<div onclick="selectMachine('${m.name}','${m.code}')"><b>${m.name}</b><br><small style="color:#666">${m.code}</small></div>`
  ).join('');
  dd.style.display = "block";
}

function selectMachine(n, c) {
  document.getElementById("machineInput").value = n;
  document.getElementById("machineCode").value = c;
  document.getElementById("machineName").value = n;
  document.getElementById("dropdown").style.display = "none";
}

// ── PARTS ──
function togglePart() {
  document.getElementById("partsBox").style.display = hasPart.checked ? "block" : "none";
}

function addPart() {
  const row = document.createElement("div");
  row.className = "part-row";
  row.innerHTML = `
    <div class="row1">
      <input placeholder="Code">
      <input type="number" value="1">
      <button onclick="this.parentElement.parentElement.remove()">X</button>
    </div>
    <div class="row2"><input placeholder="Name"></div>`;
  document.getElementById("parts").appendChild(row);
}

function getParts() {
  let arr = [];
  document.querySelectorAll(".part-row").forEach(r => {
    const row1 = r.querySelector(".row1").querySelectorAll("input");
    const name = r.querySelector(".row2 input").value;
    arr.push({ code: row1[0].value, qty: row1[1].value, name: name });
  });
  return arr;
}

// ── USERS ──
function loadUsers() {
  let opts = USERS.map(u => `<option value="${u}">${u}</option>`).join("");
  ["req","acc","deliver","owner"].forEach(id => document.getElementById(id).innerHTML = opts);
}

// ── VALIDATE ──
function validateForm() {
  let fields = ["machineCode","machineName","date","sym","tstop","tstart","tfin","req","acc","cause","act","datef","owner","deliver"];
  let ok = true;
  fields.forEach(id => {
    const f = document.getElementById(id);
    f.classList.remove("error");
    if (!f.value || f.value.trim() === "") { f.classList.add("error"); ok = false; }
  });
  return ok;
}

// ── RESIZE IMAGE ──
function resizeImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => img.src = e.target.result;
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const maxW = 800;
      const scale = maxW / img.width;
      canvas.width = maxW;
      canvas.height = img.height * scale;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.7));
    };
    reader.readAsDataURL(file);
  });
}

// ── JSONP CALL (สำหรับ save text + รับ rowIndex กลับ) ──
function jsonpCall(url) {
  return new Promise((resolve, reject) => {
    const cbName = "cb_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      delete window[cbName];
      script.remove();
      reject(new Error("JSONP timeout"));
    }, 15000);

    window[cbName] = function(res) {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
      resolve(res);
    };

    script.onerror = () => { clearTimeout(timer); reject(new Error("Script load error")); };
    script.src = url;
    document.body.appendChild(script);
  });
}

// ── POST IMAGE (ส่งทีละรูป เพื่อหลีก timeout) ──
async function postImage(rowIndex, key, base64) {
  if (!base64) return;
  const payload = { action: "saveImage", rowIndex: rowIndex, key: key, base64: base64 };
  await fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  });
}

// ── MAIN SAVE ──
async function save() {
  if (!validateForm()) { alert("กรุณากรอกข้อมูลให้ครบ"); return; }

  const btn = document.querySelector(".btn");
  btn.disabled = true;

  try {
    // Step 1: resize รูป
    setProgress(10, "📷 กำลังเตรียมรูปภาพ...");
    const files = ["img1","img2","img3"].map(id => document.getElementById(id).files[0]);
    const b64s = await Promise.all(files.map(f => f ? resizeImage(f) : Promise.resolve("")));

    // Step 2: save text ผ่าน JSONP → ได้ rowIndex กลับ
    setProgress(30, "💾 กำลังบันทึกข้อมูล...");
    const parts = getParts();
    const textPayload = {
      code:    document.getElementById("machineCode").value,
      name:    document.getElementById("machineName").value,
      date:    document.getElementById("date").value,
      sym:     document.getElementById("sym").value,
      tstop:   document.getElementById("tstop").value,
      tstart:  document.getElementById("tstart").value,
      req:     document.getElementById("req").value,
      acc:     document.getElementById("acc").value,
      cause:   document.getElementById("cause").value,
      act:     document.getElementById("act").value,
      datef:   document.getElementById("datef").value,
      tfin:    document.getElementById("tfin").value,
      deliver: document.getElementById("deliver").value,
      owner:   document.getElementById("owner").value,
      parts:   parts
    };

    const jsonpUrl = GAS_URL + "?action=saveText&callback=cb_" + Date.now() +
                     "&data=" + encodeURIComponent(JSON.stringify(textPayload));
    const result = await jsonpCall(jsonpUrl.replace(/callback=cb_\d+/, "callback=cb_" + Date.now()));

    if (!result || result.status !== "ok") throw new Error("บันทึก text ไม่สำเร็จ: " + JSON.stringify(result));

    const rowIndex = result.rowIndex;
    console.log("✅ Text saved at row:", rowIndex);

    // Step 3: ส่งรูปทีละรูป ผ่าน POST
    const imgLabels = ["image1","image2","image3"];
    for (let i = 0; i < 3; i++) {
      if (b64s[i]) {
        setProgress(50 + i * 15, `🖼 กำลังอัปโหลดรูป ${i+1}/3 ไป Google Drive...`);
        await postImage(rowIndex, imgLabels[i], b64s[i]);
        await new Promise(r => setTimeout(r, 1000)); // หน่วงเล็กน้อย
      }
    }

    setProgress(100, "✅ เสร็จสมบูรณ์!");
    setTimeout(() => {
      hideProgress();
      alert("✅ บันทึกสำเร็จ! รูปภาพอัปโหลดไป Google Drive แล้ว");
      resetForm();
      setTimeout(() => loadFromSheet(), 5000);
    }, 800);

  } catch (err) {
    hideProgress();
    alert("❌ เกิดข้อผิดพลาด: " + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "SAVE";
  }
}

// ── LOAD FROM SHEET ──
function loadFromSheet() {
  window.handleData = function(res) {
    data = (res || []).map(row => {
      if (Array.isArray(row)) {
        return { code:row[1]||"",name:row[2]||"",date:row[3]||"",sym:row[4]||"",tstop:row[5]||"",tstart:row[6]||"",req:row[7]||"",acc:row[8]||"",cause:row[9]||"",act:row[10]||"",datef:row[11]||"",tfin:row[12]||"",deliver:row[13]||"",owner:row[14]||"",partCode:row[15]||"",partName:row[16]||"",qty:row[17]||"",image1:row[18]||"",image2:row[19]||"",image3:row[20]||"" };
      }
      return {
        code:row.code||"",name:row.name||"",date:row.date||"",sym:row.sym||"",
        tstop:row.tstop||"",tstart:row.tstart||"",req:row.req||"",acc:row.acc||"",
        cause:row.cause||"",act:row.act||"",datef:row.datef||"",tfin:row.tfin||"",
        deliver:row.deliver||"",owner:row.owner||"",partCode:row.partCode||"",
        partName:row.partName||"",qty:row.qty||"",
        image1:row.image1||"",image2:row.image2||"",image3:row.image3||""  // ← แก้จาก image เป็น image1/2/3
      };
    });
    render();
  };
  const script = document.createElement("script");
  script.src = GAS_URL + "?callback=handleData";
  document.body.appendChild(script);
}

// ── RENDER HISTORY ──
function getFilteredData() {
  let q = document.getElementById("searchHistory")?.value?.toLowerCase() || "";
  let m = document.getElementById("filterMachine")?.value || "";
  return data.filter(d => {
    let matchSearch = (d.code+d.name+d.sym+d.req+d.acc+d.cause+d.act).toLowerCase().includes(q);
    let matchMachine = m ? d.code === m : true;
    return matchSearch && matchMachine;
  });
}

function render() {
  let tbody = document.getElementById("tbHistory");
  let list = getFilteredData();
  tbody.innerHTML = list.map((d,i) => `
    <tr>
      <td>${d.code||""}</td><td>${d.name||""}</td><td>${formatDate(d.date)}</td>
      <td>${d.sym||""}</td><td>${d.tstop||""}</td><td>${d.tstart||""}</td>
      <td>${d.req||""}</td><td>${d.acc||""}</td><td>${d.cause||""}</td><td>${d.act||""}</td>
      <td>${formatDate(d.datef)}</td><td>${d.tfin||""}</td>
      <td>${d.deliver||""}</td><td>${d.owner||""}</td>
      <td>${d.partCode||""}</td><td>${d.partName||""}</td><td>${d.qty||""}</td>
      <td>
        ${(d.image1||d.image2||d.image3) ? `<div style="display:flex;gap:4px">
          ${d.image1?`<a href="${d.image1}" target="_blank"><img src="${d.image1}" style="width:40px;border-radius:6px"></a>`:""}
          ${d.image2?`<a href="${d.image2}" target="_blank"><img src="${d.image2}" style="width:40px;border-radius:6px"></a>`:""}
          ${d.image3?`<a href="${d.image3}" target="_blank"><img src="${d.image3}" style="width:40px;border-radius:6px"></a>`:""}
        </div>` : ""}
      </td>
      <td><button class="small-btn del" onclick="del(${i})">X</button></td>
    </tr>`).join("");
}

// ── DELETE ──
function del(i) { data.splice(i,1); render(); }

// ── EXPORT EXCEL ──
function exportExcel() {
  let ws_data = data.map(d => ({
    "CODE OF MACHINE": d.code, "NAME OF MACHINE": d.name,
    "วันที่": d.date, "อาการ": d.sym,
    "เวลาหยุด": d.tstop, "เวลาเริ่ม": d.tstart,
    "ผู้แจ้ง": d.req, "ผู้รับแจ้ง": d.acc,
    "สาเหตุที่เป็นไปได้": d.cause, "ดำเนินการแก้ไข": d.act,
    "วันที่เสร็จ": d.datef, "เวลาเสร็จ": d.tfin,
    "ผู้ส่งเครื่อง": d.deliver, "ผู้รับเครื่อง": d.owner,
    "Code TIK": d.partCode, "Parts Description": d.partName,
    "Price PER Unit": "", "QTY": d.qty
  }));
  let ws = XLSX.utils.json_to_sheet(ws_data);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "History");
  XLSX.writeFile(wb, "maintenance.xlsx");
}

// ── MACHINE FILTER ──
function loadMachineFilter() {
  let sel = document.getElementById("filterMachine");
  let unique = [...new Set(MACHINES.map(m => m.code))];
  sel.innerHTML = `<option value="">📊 ทุกเครื่องจักร</option>` +
    unique.map(c => `<option value="${c}">${c}</option>`).join("");
}

// ── FORMAT DATE ──
function formatDate(d) {
  if (!d) return "";
  let dateObj = new Date(d);
  return ("0"+dateObj.getDate()).slice(-2)+"/"+("0"+(dateObj.getMonth()+1)).slice(-2)+"/"+dateObj.getFullYear();
}

// ── RESET FORM ──
function resetForm() {
  ["machineInput","machineCode","machineName","date","sym","tstop","tstart","cause","act","datef","tfin"].forEach(id => document.getElementById(id).value = "");
  ["img1","img2","img3"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("hasPart").checked = false;
  document.getElementById("parts").innerHTML = "";
  document.getElementById("partsBox").style.display = "none";
  ["req","acc","deliver","owner"].forEach(id => document.getElementById(id).selectedIndex = 0);
}

window.onload = function() {
  loadUsers();
  loadFromSheet();
  loadMachineFilter();
};
</script>
