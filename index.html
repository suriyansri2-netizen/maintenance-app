function resizeImage(file, maxW=800, quality=0.7) {
  return new Promise(resolve => {
    if (!file) { resolve(""); return; }
    const img = new Image(), reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    reader.readAsDataURL(file);
  });
}

// ImgBB รองรับ CORS ทำให้ fetch ได้จาก GitHub Pages
async function uploadToImgBB(file) {
  if (!file) return "";
  try {
    const b64 = await resizeImage(file);
    const form = new FormData();
    form.append("key", IMGBB_KEY);
    form.append("image", b64.split(",")[1]);
    const res  = await fetch("https://api.imgbb.com/1/upload", { method:"POST", body:form });
    const json = await res.json();
    const url  = json.data?.url || "";
    console.log("✅ ImgBB uploaded:", url);
    return url;
  } catch(e) {
    console.error("❌ ImgBB failed:", e);
    return "";
  }
}

function jsonpGet(params) {
  return new Promise((resolve, reject) => {
    const cbName = "cb_" + Date.now() + "_" + Math.floor(Math.random()*99999);
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      delete window[cbName]; script.remove();
      reject(new Error("GAS timeout"));
    }, 20000);
    window[cbName] = function(res) {
      clearTimeout(timer); delete window[cbName]; script.remove();
      resolve(res);
    };
    script.onerror = () => {
      clearTimeout(timer); delete window[cbName]; script.remove();
      reject(new Error("Script error"));
    };
    const qs = Object.entries({...params, callback: cbName})
      .map(([k,v]) => k + "=" + encodeURIComponent(v)).join("&");
    script.src = GAS_URL + "?" + qs;
    document.body.appendChild(script);
  });
}

function validateForm() {
  const ids = ["machineCode","machineName","date","sym","tstop","tstart","tfin",
               "req","acc","cause","act","datef","owner","deliver"];
  let ok = true;
  ids.forEach(id => {
    const f = document.getElementById(id);
    f.classList.remove("error");
    if (!f.value || !f.value.trim()) { f.classList.add("error"); ok = false; }
  });
  return ok;
}

  const btn = document.querySelector(".btn");
  btn.disabled = true;
  try {
    // Step 1: อัปโหลดรูปไป ImgBB → ได้ URL
    const files = ["img1","img2","img3"].map(id => document.getElementById(id).files[0]);
    const imgbbUrls = [];
    for (let i = 0; i < 3; i++) {
      if (files[i]) {
        setProgress(10 + i*15, "📷 อัปโหลดรูป " + (i+1) + "/3...");
        imgbbUrls.push(await uploadToImgBB(files[i]));
      } else { imgbbUrls.push(""); }
    }

    // Step 2: บันทึก text + ImgBB URL ลง Sheet → ได้ rowIndex
    setProgress(55, "💾 บันทึกข้อมูล...");
    const payload = {
      code:    document.getElementById("machineCode").value,
      name:    document.getElementById("machineName").value,
      date:    document.getElementById("date").value,
      sym:     document.getElementById("sym").value,
      tstop:   document.getElementById("tstop").value,
      tstart:  document.getElementById("tstart").value,
      req:     document.getElementById("req").value,
      acc:     document.getElementById("acc").value,
      cause:   document.getElementById("cause").value,
      act:     document.getElementById("act").value,
      datef:   document.getElementById("datef").value,
      tfin:    document.getElementById("tfin").value,
      deliver: document.getElementById("deliver").value,
      owner:   document.getElementById("owner").value,
      parts:   getParts(),
      image1:  imgbbUrls[0], image2: imgbbUrls[1], image3: imgbbUrls[2]

    const r1 = await jsonpGet({ action:"save", data: JSON.stringify(payload) });
    if (!r1 || r1.status !== "ok") throw new Error("save failed: " + JSON.stringify(r1));
    const rowIndex = r1.rowIndex;
    console.log("✅ saved row:", rowIndex);

      if (!imgbbUrls[i]) continue;
      setProgress(65 + i*10, "☁️ ย้ายรูป " + (i+1) + " → Google Drive...");
      try {
        const r2 = await jsonpGet({
          action:   "moveImage",
          rowIndex: rowIndex,
          col:      cols[i],
          imgbbUrl: imgbbUrls[i]
        });
        console.log("✅ moveImage" + (i+1) + ":", r2);
      } catch(imgErr) {
        console.warn("⚠️ moveImage" + (i+1) + " failed:", imgErr.message);
        // ไม่ stop — รูปยังดูได้จาก ImgBB URL เดิม
      }
    }

    setProgress(100, "✅ บันทึกสำเร็จ!");
    setTimeout(() => {
      hideProgress();
      alert("✅ บันทึกสำเร็จ!\nรูปภาพเก็บใน Google Drive แล้ว");
      resetForm();
      setTimeout(() => loadFromSheet(), 3000);
    }, 600);

  } catch(err) {
    hideProgress();
    alert("❌ " + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "SAVE";
  }
}

function loadFromSheet() {
  window.handleData = function(res) {
    data = (res||[]).map(r => ({
      code:r.code||"", name:r.name||"", date:r.date||"",
      sym:r.sym||"", tstop:r.tstop||"", tstart:r.tstart||"",
      req:r.req||"", acc:r.acc||"", cause:r.cause||"", act:r.act||"",
      datef:r.datef||"", tfin:r.tfin||"", deliver:r.deliver||"", owner:r.owner||"",
      partCode:r.partCode||"", partName:r.partName||"", qty:r.qty||"",
      image1:r.image1||"", image2:r.image2||"", image3:r.image3||""
    }));
    render();
  };
  const s = document.createElement("script");
  s.src = GAS_URL + "?callback=handleData&t=" + Date.now();
  document.body.appendChild(s);
}

function getFilteredData() {
  const q = (document.getElementById("searchHistory")?.value||"").toLowerCase();
  const m = document.getElementById("filterMachine")?.value||"";
  return data.filter(d =>
    (d.code+d.name+d.sym+d.req+d.acc+d.cause+d.act).toLowerCase().includes(q) &&
    (m ? d.code===m : true));
}

function render() {
  document.getElementById("tbHistory").innerHTML = getFilteredData().map((d,i) => `
    <tr>
      <td>${d.code}</td><td>${d.name}</td><td>${formatDate(d.date)}</td>
      <td>${d.sym}</td><td>${d.tstop}</td><td>${d.tstart}</td>
      <td>${d.req}</td><td>${d.acc}</td><td>${d.cause}</td><td>${d.act}</td>
      <td>${formatDate(d.datef)}</td><td>${d.tfin}</td>
      <td>${d.deliver}</td><td>${d.owner}</td>
      <td>${d.partCode}</td><td>${d.partName}</td><td>${d.qty}</td>
      <td><div style="display:flex;gap:4px">
        ${d.image1?`<a href="${d.image1}" target="_blank"><img src="${d.image1}" style="width:40px;border-radius:6px" onerror="this.style.display='none'"></a>`:""}
        ${d.image2?`<a href="${d.image2}" target="_blank"><img src="${d.image2}" style="width:40px;border-radius:6px" onerror="this.style.display='none'"></a>`:""}
        ${d.image3?`<a href="${d.image3}" target="_blank"><img src="${d.image3}" style="width:40px;border-radius:6px" onerror="this.style.display='none'"></a>`:""}
      </div></td>
      <td><button class="small-btn del" onclick="del(${i})">X</button></td>
    </tr>`).join("");
}

function del(i) { data.splice(i,1); render(); }

function switchTab(t,el) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  el.classList.add('active'); document.getElementById(t).classList.add('active');
  if(t==='history') render();
}
function searchMachine(val) {
  const dd=document.getElementById("dropdown");
  if(!val){dd.style.display="none";return;}
  const q=val.toLowerCase();
  const res=MACHINES.filter(m=>m.name.toLowerCase().includes(q)||m.code.includes(q));
  dd.innerHTML=res.map(m=>`<div onclick="selectMachine('${m.name}','${m.code}')"><b>${m.name}</b><br><small style="color:#666">${m.code}</small></div>`).join('');
  dd.style.display=res.length?"block":"none";
}
function selectMachine(n,c) {
  document.getElementById("machineInput").value=n;
  document.getElementById("machineCode").value=c;
  document.getElementById("machineName").value=n;
  document.getElementById("dropdown").style.display="none";
}
function togglePart(){document.getElementById("partsBox").style.display=document.getElementById("hasPart").checked?"block":"none";}
function addPart(){
  const row=document.createElement("div"); row.className="part-row";
  row.innerHTML=`<div class="row1"><input placeholder="Code"><input type="number" value="1"><button onclick="this.parentElement.parentElement.remove()">X</button></div><div class="row2"><input placeholder="Name"></div>`;
  document.getElementById("parts").appendChild(row);
}
function getParts(){
  return [...document.querySelectorAll(".part-row")].map(r=>({
    code:r.querySelectorAll(".row1 input")[0].value,
    qty:r.querySelectorAll(".row1 input")[1].value,
    name:r.querySelector(".row2 input").value
  }));
}
function loadUsers(){
  const opts=USERS.map(u=>`<option value="${u}">${u}</option>`).join("");
  ["req","acc","deliver","owner"].forEach(id=>document.getElementById(id).innerHTML=opts);
}
function loadMachineFilter(){
  document.getElementById("filterMachine").innerHTML=`<option value="">📊 ทุกเครื่องจักร</option>`+
    [...new Set(MACHINES.map(m=>m.code))].map(c=>`<option value="${c}">${c}</option>`).join("");
}
function formatDate(d){
  if(!d)return"";
  const o=new Date(d);
  return("0"+o.getDate()).slice(-2)+"/"+("0"+(o.getMonth()+1)).slice(-2)+"/"+o.getFullYear();
}
function resetForm(){
  ["machineInput","machineCode","machineName","date","sym","tstop","tstart","cause","act","datef","tfin"]
    .forEach(id=>document.getElementById(id).value="");
  ["img1","img2","img3"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("hasPart").checked=false;
  document.getElementById("parts").innerHTML="";
  document.getElementById("partsBox").style.display="none";
  ["req","acc","deliver","owner"].forEach(id=>document.getElementById(id).selectedIndex=0);
}
function exportExcel(){
  const ws=XLSX.utils.json_to_sheet(data.map(d=>({"CODE":d.code,"NAME":d.name,"DATE":d.date,
    "SYMPTOM":d.sym,"STOP":d.tstop,"START":d.tstart,"REQ":d.req,"ACC":d.acc,
    "CAUSE":d.cause,"ACTION":d.act,"FINISH DATE":d.datef,"FINISH TIME":d.tfin,
    "DELIVER":d.deliver,"OWNER":d.owner,"PART CODE":d.partCode,"PART NAME":d.partName,"QTY":d.qty})));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"History");
  XLSX.writeFile(wb,"maintenance.xlsx");
}

window.onload=function(){loadUsers();loadFromSheet();loadMachineFilter();};
</script>
</body>
</html>
