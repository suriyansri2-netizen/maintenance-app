<script>

const API_URL = "PUT_YOUR_GOOGLE_SCRIPT_URL_HERE";

let data = [];
let MACHINES = [];
let PERSON = [];

/* TAB */
function switchTab(t,el){
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
el.classList.add('active');
document.getElementById(t).classList.add('active');
if(t==='history') render();
}

/* JSON */
function loadJSON(){
try{MACHINES=JSON.parse(jsonBox.value);alert("Machine OK")}
catch{alert("JSON ผิด")}
}

function loadPerson(){
try{PERSON=JSON.parse(personBox.value);alert("Person OK")}
catch{alert("JSON ผิด")}
}

/* MACHINE SEARCH */
function searchMachine(val){
const dd=dropdown;
if(val.length<1){dd.style.display="none";return;}
const q=val.toLowerCase();
const res=MACHINES.filter(m=>m.name.toLowerCase().includes(q)||m.code.includes(q));

dd.innerHTML=res.map(m=>`
<div onclick="selectMachine('${m.name}','${m.code}')">
${m.name}<br><small>${m.code}</small>
</div>`).join('');

dd.style.display="block";
}

function selectMachine(n,c){
machineInput.value=n;
machineCode.value=c;
machineName.value=n;
dropdown.style.display="none";
}

/* PERSON SEARCH */
function searchPerson(input){
const dd=input.nextElementSibling;
const q=input.value.toLowerCase();

if(q.length<1){dd.style.display="none";return;}

const res=PERSON.filter(p=>p.toLowerCase().includes(q));

dd.innerHTML=res.map(p=>`
<div onclick="selectPerson('${p}',this)">${p}</div>
`).join('');

dd.style.display="block";
}

function selectPerson(val,el){
el.parentElement.previousElementSibling.value=val;
el.parentElement.style.display="none";
}

/* CLICK OUTSIDE */
document.addEventListener("click",e=>{
document.querySelectorAll(".dd").forEach(d=>{
if(!d.parentElement.contains(e.target)){
d.style.display="none";
}
});
});

/* PART */
function togglePart(){
partsBox.style.display=hasPart.checked?"block":"none";
}

function addPart(){
const row=document.createElement("div");
row.className="part-row";
row.innerHTML=`
<input placeholder="Code">
<input placeholder="Name">
<input type="number" value="1">
<button onclick="this.parentElement.remove()">x</button>
`;
parts.appendChild(row);
}

function getParts(){
let arr=[];
document.querySelectorAll(".part-row").forEach(r=>{
const i=r.querySelectorAll("input");
arr.push({
code:i[0].value,
name:i[1].value,
qty:i[2].value
});
});
return arr;
}

/* =========================
   🔴 SAVE TO GOOGLE SHEET
========================= */
function save(){

const payload = {
code: machineCode.value,
name: machineName.value,
date: date.value,
sym: sym.value,
tstop: tstop.value,
tstart: tstart.value,
tfin: tfin.value,
req: req.value,
acc: acc.value,
cause: cause.value,
act: act.value,
deliver: deliver.value,
owner: owner.value,
parts: hasPart.checked ? getParts() : []
};

fetch(API_URL, {
method: "POST",
body: JSON.stringify(payload)
})
.then(r => r.text())
.then(() => {
alert("บันทึกลง Google Sheet แล้ว");
loadData();
});

}

/* =========================
   🔵 LOAD FROM GOOGLE SHEET
========================= */
function loadData(){

fetch(API_URL)
.then(r => r.json())
.then(json => {

data = json.slice(1).map(r => ({
  code: r[1],
  name: r[2],
  date: r[3],
  sym: r[4],
  tstop: r[5],
  tstart: r[6],
  tfin: r[7],
  req: r[8],
  acc: r[9],
  cause: r[10],
  act: r[11],
  deliver: r[12],
  owner: r[13],
  parts: []
}));

render();

});

}

/* RENDER */
function render(){
tb.innerHTML = data.map((d,i)=>`
<tr>
<td>${d.code}</td>
<td>${d.name}</td>
<td>${d.date}</td>
<td>${d.sym}</td>
<td>${d.tstop}</td>
<td>${d.tstart}</td>
<td>${d.req}</td>
<td>${d.acc}</td>
<td>${d.cause}</td>
<td>${d.act}</td>
<td>${d.tfin}</td>
<td>${d.deliver}</td>
<td>${d.owner}</td>

<td>${d.parts?.map(p=>p.code).join('<br>') || ''}</td>
<td>${d.parts?.map(p=>p.name).join('<br>') || ''}</td>
<td>${d.parts?.map(p=>p.qty).join('<br>') || ''}</td>

<td><button class="small-btn del" onclick="del(${i})">ลบ</button></td>
</tr>
`).join('');
}

/* DELETE (local only - optional) */
function del(i){
data.splice(i,1);
render();
}

/* EXPORT */
function exportCSV(){
let csv="Code,Name,Date,Symptom,Stop,Start,Req,Acc,Cause,Action,Finish,Deliver,Owner\n";

data.forEach(d=>{
csv+=`${d.code},${d.name},${d.date},${d.sym},${d.tstop},${d.tstart},${d.req},${d.acc},${d.cause},${d.act},${d.tfin},${d.deliver},${d.owner}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="maintenance.csv";
a.click();
}

/* INIT */
loadData();

</script>
